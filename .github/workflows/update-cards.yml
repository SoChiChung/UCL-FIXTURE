name: Update Cards Board

# 欧冠黄红牌榜自动更新
# 规则（主人指定）：每个比赛日「前 2 天」到「后 2 天」期间，每天早上 9:00 更新一次。
# 覆盖「当天 01:00~22:59（北京时间）」，等效于连续 5 天 × 每天 9 点前后各取样一次。
# 赛事休赛期（两轮比赛日之间超过 2 天的空档）不触发，避免无意义请求。
#
# 时区：cron 用 UTC，这里按北京时间 (UTC+8) 换算 —— 09:00 CST = 01:00 UTC。
# 但为了直观可靠，直接在 UTC 01:00 触发并在脚本里以「北京时间」判断日期窗口。

on:
  schedule:
    # 北京时间每天 09:00（= UTC 01:00）
    - cron: '0 1 * * *'
  workflow_dispatch:

permissions:
  contents: write
  # 数据更新后需要用 gh workflow run 触发 deploy.yml，因此需要 actions: write
  actions: write

# concurrency 必须是顶层键；此前误嵌进 permissions，导致整个 workflow 解析失败，
# 定时任务从未被注册（这也是此前 10/14 之后榜单没自动更新的原因）。
concurrency:
  group: cards-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 抓取 FotMob 公开统计端点，生成 src/data/cards.json
      # 脚本内置「是否处于更新窗口」判断：不在窗口内会自行跳过并保持退出码 0
      - name: Fetch cards
        run: node scripts/fetch-cards.mjs

      # 有变化才提交并推送（保持仓库整洁，不刷无意义 commit）
      # 注意：GITHUB_TOKEN 推送的 commit 不会触发其他 workflow（GitHub 防递归），
      # 所以 deploy.yml 的 push 触发器在这里是失效的，必须在后面显式 dispatch。
      - name: Commit if changed
        id: commit
        run: |
          if git diff --quiet -- src/data/cards.json; then
            echo "cards.json 无变化，跳过提交"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/cards.json
          MSG="chore(cards): 更新黄红牌榜 $(TZ=Asia/Shanghai date +%Y-%m-%d)"
          git commit -m "$MSG"
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # workflow_dispatch 是 GITHUB_TOKEN 防递归规则的例外，可以正常触发部署
      - name: Trigger deploy
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy.yml --ref main